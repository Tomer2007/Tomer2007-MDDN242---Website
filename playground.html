<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPC Playground</title>
  <link rel="stylesheet" href="playground.css">
  <link id="dialogue-font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Micro+5&display=swap">

</head>
<body>
  <div id="arena" class="arena" aria-label="Play area">
    <img src="Assets/Mobile/Tomer'sWebsiteMobileMap.png.png" class="world-map" alt="">
    <img id="world-hitbox" src="Assets/Mobile/Tomer'sWebsiteMobileHitbox1.png.png" alt="" hidden>
    <canvas id="hitbox-canvas" hidden></canvas>

    <div class="game-square" id="Bored NPC"
      data-x="85" data-y="-58"
      data-idle-1="Assets/Mobile/MobileNPCIdle1.png.png"
      data-idle-2="Assets/Mobile/MobileNPCIdle2.png.png"
      data-walk-1="Assets/Mobile/MobileNPCWalk1.png"
      data-walk-2="Assets/Mobile/MobileNPCWalk2.png"
      data-can-move="true"
      data-dialogue-mode="sequence"
      data-dialogue="Hey. || ... || ... ... || Hey. || If your looking for the /n Ghost of Projects Past, he's not in the demo. || At least not yet. || Give it a couple days he always manages to show up.">
    </div>

    <div class="game-square" id="excited NPC"
      data-x="19" data-y="-203"
      data-idle-1="Assets/Mobile/MobileNPCIdle1.png.png"
      data-idle-2="Assets/Mobile/MobileNPCIdle2.png.png"
      data-walk-1="Assets/Mobile/MobileNPCWalk1.png"
      data-walk-2="Assets/Mobile/MobileNPCWalk2.png"
      data-can-move="false"
      data-dialogue-mode="sequence"
      data-dialogue="Hello, welcome to the Tomer's Website Demo || Please use a Computer Device to play the full version! || We don't really have a lot to do here. || . . . || Wanna play Pac Man? || Well here ya go! /n {link:PACMANLINK.HTML.HTTPS.MOBILE|https://www.google.com/search?q=pacman} || Oh wait that doesn't work yet. || We really don't get a lot to do here.">
    </div>

    <div class="game-square" id="the legendary Mobile Chicken"
      data-x="-150" data-y="-140"
      data-idle-1="Assets/Mobile/MobileChicken.png"
      data-idle-2="Assets/Mobile/MobileChicken.png"
      data-walk-1="Assets/Mobile/MobileChicken.png"
      data-walk-2="Assets/Mobile/MobileChicken.png"
      data-can-move="true"
      data-dialogue-mode="random"
      data-dialogue="Bawk! || Chirp! || Bakaw! || Hello I Am Mobile Chicken || Have You Seen My Brother?">
    </div>

    <img id="player" class="player-sprite" src="Assets/Mobile/MobilePlayerIdle1.png.png" alt="Player">
  </div>

  <div id="dialogueBox" class="dialogue-box" hidden>
    <div class="dialogue-panel">
      <strong id="dialogueName"></strong>
      <p id="dialogueText"></p>
    </div>
  </div>

  <div id="tomeboy-frame" class="tomeboy-frame" aria-hidden="true">
    <img src="Assets/WebsiteTomeBoySprite.png.png" class="tomeboy-sprite" alt="">
  </div>

  <div id="button-controls" class="button-controls" aria-label="On-screen controls">
    <div class="controller-wrap">
      <img src="Assets/WebsiteGameBoyButton.png.png" class="controller-sprite" alt="Controller" draggable="false">
      <button type="button" id="upBtn"    class="ctrl-hit dpad-hit up"    aria-label="Move up"></button>
      <button type="button" id="leftBtn"  class="ctrl-hit dpad-hit left"  aria-label="Move left"></button>
      <button type="button" id="rightBtn" class="ctrl-hit dpad-hit right" aria-label="Move right"></button>
      <button type="button" id="downBtn"  class="ctrl-hit dpad-hit down"  aria-label="Move down"></button>
      <button type="button" id="actionBtn" class="ctrl-hit action-hit a-btn" aria-label="Interact"></button>
      <button type="button" id="sprintBtn" class="ctrl-hit action-hit b-btn" aria-pressed="false" aria-label="Sprint"></button>
    </div>
  </div>

  <script src="playground.js"></script>
</body>
</html>
