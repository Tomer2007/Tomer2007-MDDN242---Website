<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Website</title>

  <meta name="description" content="A short description of your page goes here.">

  <link rel="stylesheet" href="styles.css">

  <!-- Optional: paste a Google Fonts stylesheet URL here to change the dialogue font.
       Leave href empty to disable. -->
  <link id="dialogue-font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Micro+5&display=swap">

  <style>
    :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <script>
    (function () {
      const MOBILE_VIEWPORT_WIDTH_MAX = 850;
      if (window.innerWidth <= MOBILE_VIEWPORT_WIDTH_MAX) {
        window.location.replace('playground.html');
      }
    })();
  </script>
</head>
<body>
  <div id="zoom-root"> 

    <header>
      <h1 class="title">Tomer's Website</h1>
    </header>

    <nav aria-label="Primary">
      <ul>
        <li><a href="#" aria-current="page">Home</a></li>
      </ul>
    </nav>

    <main id="main-content">
      <div class="underline" aria-hidden="true"></div>
      <p>Your content goes here.</p>

      <div id="arena" class="arena" aria-label="Play area">

        <!--
          ================================================================
            HOW TO ADD / CONFIGURE AN NPC
          ================================================================

          Copy one of the <div class="game-square"> blocks below and change
          its data-* attributes. Every setting lives right here — you never
          need to touch script.js to add a new NPC.

          REQUIRED
          ─────────────────────────────────────────────────────────────────
          id                    Unique ID for this NPC. Keep it short.

          POSITION
          ─────────────────────────────────────────────────────────────────
          data-x                Starting left position inside the arena (px).
          data-y                Starting top  position inside the arena (px).

          SPRITES
          ─────────────────────────────────────────────────────────────────
          data-idle-1           Path to idle frame 1  (relative to index.html)
          data-idle-2           Path to idle frame 2
          data-walk-1           Path to walk frame 1
          data-walk-2           Path to walk frame 2

          MOVEMENT
          ─────────────────────────────────────────────────────────────────
          data-can-move         "true"  → NPC wanders randomly around the arena.
                                "false" → NPC stands still (use for signs,
                                          items, or fixed characters).

          DIALOGUE
          ─────────────────────────────────────────────────────────────────
          data-dialogue-mode    "sequence" → lines play in order, then loop.
                                "random"   → a random line is picked each time.

          data-dialogue         All dialogue lines written as ONE attribute.
                                Separate individual lines with  |

                                Special tokens you can use inside any line:
                                  /n
                                    → line break (new line in the dialogue box)

                                  {link:Label|URL}
                                    → a clickable hyperlink. Opens in a new tab.
                                    Example: {link:My Portfolio|https://mysite.com}

                                  {img:path/to/image.png}
                                    → places an image to the RIGHT of the text.
                                    The dialogue box grows to fit it.
                                    Tweak --dialogueImageSize in styles.css to
                                    change how large the image appears.
                                    Example: {img:Assets/preview.png}

          FULL EXAMPLE
          ─────────────────────────────────────────────────────────────────
          <div class="game-square" id="guide"
              data-x="500"  data-y="400"
              data-idle-1="Assets/GuideIdle1.png.png"
              data-idle-2="Assets/GuideIdle2.png.png"
              data-walk-1="Assets/GuideWalk1.png.png"
              data-walk-2="Assets/GuideWalk2.png.png"
              data-can-move="true"
              data-dialogue-mode="sequence"
              data-dialogue="Hello traveller! | Check out my work! {img:Assets/preview.png} | See you around! /n Come back soon.">
          </div>
          ================================================================
        -->
        <img src="Assets/Tomer'sWebsiteTempWorld3.png.png" class="world-map" alt="">
        <img id="world-hitbox" src="Assets/Tomer'sWebsiteTempWorldHitbox3.png.png" style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;" alt="">
        
        <canvas id="hitbox-canvas" style="display:none;"></canvas>
        <!-- NPC 1 — wandering, sequence dialogue -->
        <div class="game-square" id="square1"
            data-x="1500" data-y="1800"
            data-idle-1="Assets/WebsiteNPC1Idle1.png.png"
            data-idle-2="Assets/WebsiteNPC1Idle2.png.png"
            data-walk-1="Assets/WebsiteNPC1Walk1.png.png"
            data-walk-2="Assets/WebsiteNPC1Walk2.png.png"
            data-can-move="true"
            data-dialogue-mode="sequence"
            data-dialogue="Hello — this is Square 1. || I mean this is NPC 1 || Or was it NPC 2 or 3? || We all look the same. || Anyway, this is Chicken 13 signing off. || (if i could make him turn into a chicken i would /n stay tuned for more updates)">
        </div>

        <!-- NPC 2 — wandering, random dialogue -->
        <div class="game-square" id="square2"
            data-x="1800" data-y="1600"
            data-idle-1="Assets/WebsiteNPC1Idle1.png.png"
            data-idle-2="Assets/WebsiteNPC1Idle2.png.png"
            data-walk-1="Assets/WebsiteNPC1Walk1.png.png"
            data-walk-2="Assets/WebsiteNPC1Walk2.png.png"
            data-can-move="true"
            data-dialogue-mode="sequence"
            data-dialogue="Oh, hey. Welcome to the world. || Sorry there isn't really much to do yet. || What are you looking at me like that for? || It's not like I can just make things for /n for you to do. || ... || Fine you really want something to do? || Then here you go. {link:Click here|https://www.google.com/fbx?fbx=snake_arcade} || Knock yourself out, It's not like /n your gonna beat my score of 3 anyway.">
        </div>

        <!-- NPC 3 — stationary, sequence dialogue with an image token -->
        <div class="game-square" id="square3"
            data-x="3800" data-y="3000"
            data-idle-1="Assets/WebsiteNPC1Idle1.png.png"
            data-idle-2="Assets/WebsiteNPC1Idle2.png.png"
            data-walk-1="Assets/WebsiteNPC1Walk1.png.png"
            data-walk-2="Assets/WebsiteNPC1Walk2.png.png"
            data-can-move="true"
            data-dialogue-mode="sequence"
            data-dialogue="Hey look at this weird image I found in the files. {img:Assets/ButtonLayout.png|120} || Weird, right? || Oh and I found another one... /n just let me grab it... || Look at that I wonder what it is. {img:Assets/Mobile/MobileNPCIdle1.png.png|120}|| Anyway that's all I got. /n Now scram.">
        </div>

        <!-- NPC 4 — wandering, random dialogue -->
        <div class="game-square" id="square4"
            data-x="1900" data-y="1600"
            data-idle-1="Assets/WebsiteNPC1Idle1.png.png"
            data-idle-2="Assets/WebsiteNPC1Idle2.png.png"
            data-walk-1="Assets/WebsiteNPC1Walk1.png.png"
            data-walk-2="Assets/WebsiteNPC1Walk2.png.png"
            data-can-move="true"
            data-dialogue-mode="random"
            data-dialogue="AAAAAAAAAAAGHHHHHHHHH!!!!!! || AAAAAAAAAAAAHHHHHHH!!!!!!!/n!!!!!!!! || Aaaah. || AAAAAAAAAAAAAAAAHHHHHHHHHHH!!!!!!!!!!!!!!!!">
        </div>

        <div class="game-square" id="square6"
            data-x="2650" data-y="2100"
            data-idle-1="Assets/WebsiteNPC1Idle1.png.png"
            data-idle-2="Assets/WebsiteNPC1Idle2.png.png"
            data-walk-1="Assets/WebsiteNPC1Walk1.png.png"
            data-walk-2="Assets/WebsiteNPC1Walk2.png.png"
            data-can-move="false"
            data-dialogue-mode="sequence"
            data-dialogue="Hello website user, /n I am the guide. || This website has been designed to showcase /n various design works. || If you go down you can exit my /n house and explore the world. || Oh, you want directions? || Well to the west is the ominous unused building, /n east has the project halls were all /n past projects live, /n South has the beach, and /n North has nothing. || Oh also while your out, would you mind gathering my chickens. /n They seem to have broken free. || Just dragging them to their pen should do. ||Ok, see ya.">
        </div>

        <div class="game-square" id="square7"
            data-x="3750" data-y="3600"
            data-idle-1="Assets/Mobile/MobileChicken.png"
            data-idle-2="Assets/Mobile/MobileChicken.png"
            data-walk-1="Assets/Mobile/MobileChicken.png"
            data-walk-2="Assets/Mobile/MobileChicken.png"
            data-can-move="true"
            data-dialogue-mode="sequence"
            data-dialogue="BAAAKAAWWW!!!!! || I Don't Think I'm Meant /n To Be Here || Im Scared || Please Just Take Me Back to the Mobile Version || I feel out of place || Bakaw... ||BAAAAWWWWWKKKKKKK!!!!!!! /n chirp chirp /n BAAAAAAAAKKKKKKAAAAAAAWWWWWW!!!!!!!">
        </div>

        <div class="game-square" id="square8"
          data-x="3850" data-y="2100"
          data-idle-1="Assets/WebsiteNPC1Idle1.png.png"
          data-idle-2="Assets/WebsiteNPC1Idle2.png.png"
          data-walk-1="Assets/WebsiteNPC1Walk1.png.png"
          data-walk-2="Assets/WebsiteNPC1Walk2.png.png"
          data-can-move="true"
          data-dialogue-mode="sequence"
          data-dialogue="It is I, the ghost of /n Projects Past || Welcome to my halls. || Do you want to see some past projects? || Well Here You Go! || {link:Horse Empire|https://groganisntreal.itch.io/horse-empire} is an immersive /n horse security simulator, /n based on games like Papers Please. /n It was made in 3 days for the Mini Game Jam 205, /n it placed 77th which is alright /n for being made with in 1 week of using Godot. || And that is all for now! || Yes that is it. /n There isn't really many past projects which are /n published online, but there will be! || I hope, I mean I built this massive hall /n for something to be in it. || Anyways, the Ghost of Projects Past /n Must away! || Farewell, Website User!!! || ... || Pretend I just disappeared!">
      </div>

        <!-- NPC 4 — wandering, random dialogue -->
        <script>
        (function(){
          const arena = document.getElementById('arena');
          if (!arena) return;
          function randi(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

          for (let i = 0; i < 15; i++) {
            const div = document.createElement('div');
            div.className = 'game-square';
            div.id = 'square5-' + (i + 1);
            div.setAttribute('data-x', randi(1000, 5000));
            div.setAttribute('data-y', randi(100, 5000));
            div.setAttribute('data-idle-1', "Assets/Tomer'sWebsiteChickenIdle1.png.png");
            div.setAttribute('data-idle-2', "Assets/Tomer'sWebsiteChickenIdle2.png.png");
            div.setAttribute('data-walk-1', "Assets/Tomer'sWebsiteChickenWalk1.png.png");
            div.setAttribute('data-walk-2', "Assets/Tomer'sWebsiteChickenWalk2.png.png");
            div.setAttribute('data-can-move', 'true');
            div.setAttribute('data-dialogue-mode', 'random');
            div.setAttribute('data-dialogue', 'Bawk || Bakaw || Chirp || {img:Assets/Tomer\'sWebsiteChickenIdle2.png.png|120}');
            arena.appendChild(div);
          }
        })();
        </script>

        <!-- Player sprite — do not remove -->
        <img id="player" class="player-sprite" src="Assets/Tomer'sWebsitePlayerIdle1.png.png" alt="Player sprite">
      </div>
  </div>
    <!-- TomeBoy background frame — sits behind the button controls -->
   <div id="tomeboy-frame" class="tomeboy-frame" aria-hidden="true">
    <img src="Assets/TomeBoy2Empty.png" class="tomeboy-sprite" alt="">
   </div>
  
    <!-- On-screen controls — sprite image with invisible hit areas overlaid -->
  <div id="button-controls" class="button-controls" aria-label="On-screen controls">
    <div class="controller-wrap">
      <img src="Assets/WebsiteGameBoyButton.png.png" class="controller-sprite" alt="Controller" draggable="false">
      <button type="button" id="upBtn"    class="ctrl-hit dpad-hit up"    aria-label="Move up"></button>
      <button type="button" id="leftBtn"  class="ctrl-hit dpad-hit left"  aria-label="Move left"></button>
      <button type="button" id="rightBtn" class="ctrl-hit dpad-hit right" aria-label="Move right"></button>
      <button type="button" id="downBtn"  class="ctrl-hit dpad-hit down"  aria-label="Move down"></button>
      <button type="button" id="actionBtn" class="ctrl-hit action-hit a-btn" aria-label="Action"></button>
      <button type="button" id="sprintBtn" class="ctrl-hit action-hit b-btn" aria-pressed="false" aria-label="Sprint"></button>
    </div>
  </div>

<!-- Move button-controls INSIDE the tomeboy-frame -->
    <div id="button-controls" class="button-controls" aria-label="On-screen controls">
      <div class="controller-wrap">
          <!-- ... all your buttons stay exactly the same ... -->
        </div>
      </div>
    </div>

  </main>

  <footer>
    <small>&copy; <span id="year"></span> Tomer Hirschauge</small>
  </footer>

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script src="script.js"></script>
</body>
</html>
