        <!--
          ================================================================
            HOW TO ADD / CONFIGURE AN NPC
          ================================================================

          Copy one of the <div class="game-square"> blocks below and change
          its data-* attributes. Every setting lives right here — you never
          need to touch script.js to add a new NPC.

          REQUIRED
          ─────────────────────────────────────────────────────────────────
          id                    Unique ID for this NPC. Keep it short.

          POSITION
          ─────────────────────────────────────────────────────────────────
          data-x                Starting left position inside the arena (px).
          data-y                Starting top  position inside the arena (px).

          SPRITES
          ─────────────────────────────────────────────────────────────────
          data-idle-1           Path to idle frame 1  (relative to index.html)
          data-idle-2           Path to idle frame 2
          data-walk-1           Path to walk frame 1
          data-walk-2           Path to walk frame 2

          MOVEMENT
          ─────────────────────────────────────────────────────────────────
          data-can-move         "true"  → NPC wanders randomly around the arena.
                                "false" → NPC stands still (use for signs,
                                          items, or fixed characters).

          DIALOGUE
          ─────────────────────────────────────────────────────────────────
          data-dialogue-mode    "sequence" → lines play in order, then loop.
                                "random"   → a random line is picked each time.

          data-dialogue         All dialogue lines written as ONE attribute.
                                Separate individual lines with  ||

          INTERACTION MODE
          ─────────────────────────────────────────────────────────────────
          data-interaction-type "dialogue" (default) → shows dialogue box.
                                "button"             → runs a variable action.

          BUTTON ACTION (for data-interaction-type="button")
          ─────────────────────────────────────────────────────────────────
          data-action-target    Variable path on window, e.g. isNight
                                or gameState.speedMultiplier.
          data-action-mode      "toggle" (default), "set", or "add".
          data-action-value     Value used by "set" and "add".
                                Parsed as boolean/number/JSON/string.

          BUTTON SPRITES (for data-interaction-type="button")
          ─────────────────────────────────────────────────────────────────
          data-button-off-idle1..N  Frames shown when button is OFF.
          data-button-on-idle1..N   Frames shown when button is ON.
          data-button-on-when       Optional explicit ON value match.
                                    If omitted, ON is based on the target
                                    value's truthiness.

          data-text-box-type    "try"    → uses popup panel style (playground-like).
                                any other value / missing → normal floating dialogue.

          data-night-idle1..N   (optional) night idle animation frames.
                                Example: data-night-idle1, data-night-idle2, etc.
                                Frames are read in number order.
                                Legacy fallback still supported: data-night-idle.
          data-night-dialogue   (optional) dialogue used when isNight=true.
          data-night-dialogue-mode (optional) "sequence" or "random" for night dialogue.

                                Special tokens you can use inside any line:
                                  /n
                                    → line break (new line in the dialogue box)

                                  {link:Label|URL}
                                    → a clickable hyperlink. Opens in a new tab.
                                    Example: {link:My Portfolio|https://mysite.com}

                                  {img:path/to/image.png}
                                    → places an image to the RIGHT of the text.
                                    The dialogue box grows to fit it.
                                    Tweak --dialogueImageSize in styles.css to
                                    change how large the image appears.
                                    Example: {img:Assets/preview.png}

                                  {size_change:24}
                                    → put this at the START of a dialogue line
                                    to set that line's text size in px.
                                    Example: {size_change:28} Big text line

          FULL EXAMPLE
          ─────────────────────────────────────────────────────────────────
          <div class="game-square" id="guide"
              data-x="500"  data-y="400"
              data-idle-1="Assets/GuideIdle1.png"
              data-idle-2="Assets/GuideIdle2.png"

              data-dialogue-mode="sequence"
              data-dialogue="Hello traveller! | Check out my work! {img:Assets/preview.png} | See you around! /n Come back soon.">
          </div>
          ================================================================
        -->
